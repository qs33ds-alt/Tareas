<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mis tareas</title>
  <style>
    :root{--bg:#f5f2eb;--card:#fffdf8;--ink:#26231f;--muted:#7a746a;--line:#ded8cc;--accent:#2f6b57;--accent2:#e5efe9;--danger:#a64b4b}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:720px;margin:auto;padding:22px 16px 100px} header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 2px 20px}
    h1{margin:0;font-size:38px;letter-spacing:-.03em}.date,.muted{color:var(--muted);font-size:14px}
    .card{background:var(--card);border:1px solid rgba(100,90,70,.1);border-radius:24px;padding:18px;margin-bottom:16px}
    .mic{width:100%;border:0;border-radius:20px;padding:20px;font-size:20px;font-weight:750;background:var(--accent);color:#fff;cursor:pointer}
    .mic.listening{background:#8b3f3f}.status{min-height:22px;margin:12px 4px 0;color:var(--accent);font-weight:650;font-size:14px}
    .hint{margin:8px 4px 0;color:var(--muted);font-size:13px;line-height:1.45}.manual{display:flex;gap:8px}
    .manual input{flex:1;min-width:0;border:1px solid var(--line);border-radius:15px;padding:14px 15px;font-size:16px}
    .manual button,.small{border:0;border-radius:15px;font-weight:750;cursor:pointer}.manual button{background:var(--accent2);color:var(--accent);padding:0 18px;font-size:22px}
    .head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}.head h2{font-size:18px;margin:0}
    #tasks{display:flex;flex-direction:column;gap:10px}.task{display:flex;align-items:flex-start;gap:12px;background:var(--card);padding:15px;border-radius:18px;border:1px solid rgba(100,90,70,.1)}
    .task input{width:23px;height:23px;accent-color:var(--accent)}.txt{flex:1;font-size:17px;line-height:1.35}.done .txt{text-decoration:line-through;color:var(--muted)}
    .del{border:0;background:transparent;color:#aaa298;font-size:22px}.empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:18px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.small{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);padding:13px;color:var(--ink)}.danger{color:var(--danger)}
    .warn{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#fff1ef;color:#8b3f3f;font-size:13px;line-height:1.4}
  </style>
</head>
<body>
<main class="wrap">
<header><div><div class="date" id="date"></div><h1>Mis tareas</h1></div><div class="muted" id="progress"></div></header>
<section class="card">
  <button class="mic" id="micBtn">🎙️ Grabar tareas</button>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="hint">Di varias seguidas: “ir al gimnasio, comprar fruta, llamar al dentista y ordenar el despacho”.</div>
  <div class="warn" id="warn"></div>
</section>
<section class="card"><div class="manual"><input id="manual" placeholder="Escribe una tarea…"><button id="add" aria-label="Añadir">＋</button></div></section>
<div class="head"><h2>Hoy</h2><span class="muted" id="count"></span></div>
<section id="tasks"></section>
<div class="actions" style="margin-top:16px"><button class="small" id="uncheck">Desmarcar todas</button><button class="small danger" id="clear">Borrar hechas</button></div>
</main>
<script>
const KEY='tareas_voz_v2'; let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id), tasksEl=$('tasks'), statusEl=$('status'), micBtn=$('micBtn'), warn=$('warn');
$('date').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());

function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function render(){
  tasksEl.innerHTML='';
  [...tasks].sort((a,b)=>Number(a.done)-Number(b.done)).forEach(t=>{
    const row=document.createElement('div'); row.className='task'+(t.done?' done':'');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=t.done;
    cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});
    const tx=document.createElement('div'); tx.className='txt'; tx.textContent=t.text;
    const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','Borrar');
    del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});
    row.append(cb,tx,del); tasksEl.append(row);
  });
  if(!tasks.length) tasksEl.innerHTML='<div class="empty">No tienes tareas todavía.<br>Graba una o escríbela.</div>';
  const d=tasks.filter(t=>t.done).length; $('count').textContent=`${tasks.length} tarea${tasks.length===1?'':'s'}`; $('progress').textContent=tasks.length?`${d}/${tasks.length} hechas`:'';
}
function addTask(s){s=s.trim().replace(/^[\s,.;:-]+|[\s,.;:-]+$/g,''); if(!s)return; tasks.push({id:Date.now()+Math.random(),text:s[0].toUpperCase()+s.slice(1),done:false})}
function addSpeech(text){
  text=text.replace(/^(hoy\s+)?(tengo que|quiero|debo|necesito)\s+/i,'').trim();
  let parts=text.split(/\s*(?:,|;|\by\b|\bluego\b|\bdespués\b|\bademás\b)\s*/i).filter(x=>x.trim().length>1);
  if(!parts.length && text) parts=[text]; parts.forEach(addTask); save(); render();
}
function manualAdd(){const v=$('manual').value;if(!v.trim())return;addTask(v);$('manual').value='';save();render()}
$('add').addEventListener('click',manualAdd); $('manual').addEventListener('keydown',e=>{if(e.key==='Enter')manualAdd()});
$('clear').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()}); $('uncheck').addEventListener('click',()=>{tasks.forEach(t=>t.done=false);save();render()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!window.isSecureContext){
  warn.style.display='block'; warn.textContent='El micrófono necesita abrir esta app desde una dirección HTTPS. No la abras como archivo local.';
  micBtn.disabled=true; micBtn.style.opacity='.55';
}else if(!SR){
  warn.style.display='block'; warn.textContent='Este navegador no ofrece reconocimiento de voz. Prueba con Chrome en Android.';
  micBtn.disabled=true; micBtn.style.opacity='.55';
}else{
  const rec=new SR(); rec.lang='es-ES'; rec.continuous=false; rec.interimResults=true; let final='';
  micBtn.addEventListener('click',()=>{final=''; statusEl.textContent='Solicitando micrófono…'; try{rec.start()}catch(e){}});
  rec.onstart=()=>{micBtn.classList.add('listening');micBtn.textContent='⏹️ Escuchando…';statusEl.textContent='Habla con normalidad.'};
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)final+=s+' ';else interim+=s}statusEl.textContent=interim||final||'Escuchando…'};
  rec.onerror=e=>{statusEl.textContent=e.error==='not-allowed'?'Permite el acceso al micrófono en Chrome.':'No he podido escuchar bien. Prueba otra vez.'};
  rec.onend=()=>{micBtn.classList.remove('listening');micBtn.textContent='🎙️ Grabar tareas';if(final.trim()){addSpeech(final.trim());statusEl.textContent='Tareas añadidas.'}};
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
